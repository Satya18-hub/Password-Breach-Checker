```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Breach Checker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Password Breach Checker</h1>

        <p>
            Check whether your password has appeared
            in any known data breaches.
        </p>

        <div class="input-box">

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >

            <button id="toggleBtn" type="button">
                Show
            </button>

        </div>

        <button id="checkBtn" type="button">
            Check Password
        </button>

        <div id="result"></div>

        <p class="note">
            Your actual password is not sent to the API.
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
